<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEFDFB">
<title>VIP Confirmation</title>
<noscript><style>.crowd.pre .pp { opacity: 1; }</style></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo:wdth,wght@100,400;100,500;100,700&family=Rubik+Mono+One&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=7">
<style>
  /* Figma 04 — card content, coordinates relative to the card (top-left = 16, 352.3) */
  .vip { padding: calc(111 * var(--u)) calc(22.5 * var(--u)) calc(22 * var(--u)); }
  .vip .head { text-align: center; }
  .vip .gap { height: calc(59.2 * var(--u)); height: clamp(calc(20 * var(--u)), calc(100svh - 817 * var(--u)), calc(59.2 * var(--u))); }
  .vip .t-label { display: block; margin-left: calc(.5 * var(--u)); }
  /* validation: error sits inside the 24px gap above the button, so nothing moves */
  .field-wrap { position: relative; margin-top: calc(11.9 * var(--u)); }
  .field[aria-invalid="true"] { border-color: var(--red); }
  .field[aria-invalid="true"]:focus { box-shadow: 0 0 0 4px rgba(196, 42, 34, .18); }
  .field-error {
    position: absolute; left: calc(1 * var(--u)); top: calc(100% + 5 * var(--u));
    /* darker than --red: #9E1B14 on the yellow card is 5.3:1 (AA for small text) */
    font-weight: 700; font-size: calc(13 * var(--u)); line-height: 1.088; color: #9E1B14;
  }
  .field-error:empty { display: none; }
  .shake { animation: shake 380ms cubic-bezier(.36, .07, .19, .97); }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

  /* ---------- party crowd ----------
     The five characters are cut out of the Figma background (tools/cut-crowd.py):
     plate.jpg is the background without them, c1..c5 sit on top at their exact
     spots. They start hidden (.pre); 1 s after the page has loaded (.in) they
     pop up one after another from the middle outwards, a small springy rise,
     and #2's gold coins pop in around her. Then (.live) the loop: they sway
     gently from the feet, #2's coins shimmer and jitter in turn, #4 lifts her
     glass in a toast. */
  .crowd {
    position: absolute; left: 0; top: 0; width: 100%; height: calc(874 * var(--u)); pointer-events: none;
    /* the band ends at 394.67: nothing may show below it while they rise */
    clip-path: inset(0 0 calc((874 - 394.67) * var(--u)) 0);
  }
  .crowd.pre .pp { opacity: 0; }
  .crowd.in .pp { animation: ppIn 900ms cubic-bezier(.3, 1.35, .55, 1) var(--di) both; }
  @keyframes ppIn {
    0% { opacity: 0; transform: translateY(calc(18 * var(--u))) scale(.94); }
    35% { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  /* the coin on her arm (.still) is a copy over the arm, so it needs no pop */
  .crowd.in .orn:not(.still) { animation: ornIn 420ms cubic-bezier(.34, 1.8, .64, 1) calc(var(--di) + 380ms + var(--od) * .3) both; }
  @keyframes ornIn {
    0% { opacity: 0; transform: scale(.2) rotate(-40deg); }
    100% { opacity: 1; transform: none; }
  }
  .crowd .pp { transform-origin: 50% 100%; }
  .crowd .arm { transform-origin: 16% 89.75%; }            /* her shoulder */
  .orn .gl {
    position: absolute; inset: 0; overflow: hidden;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }
  .orn .gl::after {
    content: ''; position: absolute; top: -20%; bottom: -20%; left: 0; width: 60%;
    background: linear-gradient(100deg, rgba(255, 250, 215, 0), rgba(255, 250, 215, .95) 50%, rgba(255, 250, 215, 0));
    transform: translateX(-120%); opacity: 0;
  }
  .crowd.live .pp { animation: ppSway var(--d) ease-in-out var(--dl) infinite; }
  .crowd.live .pp.rev { animation-direction: reverse; }
  @keyframes ppSway {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    25% { transform: rotate(-.7deg) scaleY(1.006); }
    50% { transform: rotate(0deg) scaleY(1); }
    75% { transform: rotate(.7deg) scaleY(1.006); }
  }
  .crowd.live .orn { animation: ornVibe 2.6s linear var(--od) infinite; }
  .crowd.live .orn.still { animation-name: ornGlow; }        /* the coin on her arm stays put */
  .crowd.live .orn .gl::after { animation: ornGlint 2.6s ease-in-out var(--od) infinite; }
  @keyframes ornVibe {
    0%, 52%, 100% { transform: none; filter: brightness(1) saturate(1); }
    56% { transform: translate(calc(.5 * var(--u)), calc(-.4 * var(--u))) rotate(7deg); filter: brightness(1.25) saturate(1.2); }
    60% { transform: translate(calc(-.5 * var(--u)), calc(.3 * var(--u))) rotate(-6deg); filter: brightness(1.38) saturate(1.3); }
    64% { transform: translate(calc(.4 * var(--u)), calc(.4 * var(--u))) rotate(5deg); }
    68% { transform: translate(calc(-.35 * var(--u)), calc(-.3 * var(--u))) rotate(-3.5deg); filter: brightness(1.3) saturate(1.25); }
    72% { transform: translate(calc(.2 * var(--u)), 0) rotate(2deg); }
    78% { transform: none; filter: brightness(1.08) saturate(1.05); }
    86% { transform: none; filter: brightness(1) saturate(1); }
  }
  @keyframes ornGlow {
    0%, 52%, 100% { filter: brightness(1) saturate(1); }
    62% { filter: brightness(1.38) saturate(1.3); }
    78% { filter: brightness(1.08) saturate(1.05); }
    86% { filter: brightness(1) saturate(1); }
  }
  @keyframes ornGlint {
    0%, 54% { transform: translateX(-120%); opacity: 0; }
    58% { opacity: 1; }
    76% { transform: translateX(220%); opacity: 1; }
    80%, 100% { transform: translateX(220%); opacity: 0; }
  }
  /* a small "cheers": the arm lifts from the shoulder, clinks twice, comes down */
  .crowd.live .arm { animation: toast 3.6s cubic-bezier(.45, 0, .35, 1) .5s infinite; }
  @keyframes toast {
    0%, 10% { transform: none; }
    28% { transform: rotate(-6deg) scale(1.03); }
    33% { transform: rotate(-4.2deg) scale(1.03); }
    38% { transform: rotate(-6.4deg) scale(1.03); }
    44% { transform: rotate(-5.6deg) scale(1.03); }
    64%, 100% { transform: none; }
  }
</style>
</head>
<body>
<main class="app" id="app">
  <section class="screen page-in" aria-label="VIP confirmation">
    <img class="bg" src="assets/img/crowd/plate.jpg" alt="">
    <div class="crowd pre" id="crowd" aria-hidden="true">
      <div class="abs pp" style="--x:3;--y:241;--w:65;--h:153;--d:3.8s;--dl:0s;--di:.36s"><img src="assets/img/crowd/c1.webp" alt=""></div>
      <div class="abs pp rev" style="--x:68;--y:216;--w:88;--h:178;--d:3.2s;--dl:.25s;--di:.14s">
        <img src="assets/img/crowd/c2.webp" alt="">
        <span class="abs orn" style="--x:0;--y:1;--w:9;--h:13;--od:0s"><img src="assets/img/crowd/o1.webp" alt=""><i class="gl" style="-webkit-mask-image:url(assets/img/crowd/o1.webp);mask-image:url(assets/img/crowd/o1.webp)"></i></span>
        <span class="abs orn" style="--x:19;--y:7;--w:13;--h:13;--od:.45s"><img src="assets/img/crowd/o2.webp" alt=""><i class="gl" style="-webkit-mask-image:url(assets/img/crowd/o2.webp);mask-image:url(assets/img/crowd/o2.webp)"></i></span>
        <span class="abs orn" style="--x:38;--y:9;--w:11;--h:11;--od:.9s"><img src="assets/img/crowd/o3.webp" alt=""><i class="gl" style="-webkit-mask-image:url(assets/img/crowd/o3.webp);mask-image:url(assets/img/crowd/o3.webp)"></i></span>
        <span class="abs orn" style="--x:59;--y:28;--w:13;--h:9;--od:.2s"><img src="assets/img/crowd/o4.webp" alt=""><i class="gl" style="-webkit-mask-image:url(assets/img/crowd/o4.webp);mask-image:url(assets/img/crowd/o4.webp)"></i></span>
        <span class="abs orn" style="--x:8;--y:45;--w:14;--h:13;--od:.65s"><img src="assets/img/crowd/o5.webp" alt=""><i class="gl" style="-webkit-mask-image:url(assets/img/crowd/o5.webp);mask-image:url(assets/img/crowd/o5.webp)"></i></span>
        <span class="abs orn" style="--x:27;--y:14;--w:8;--h:10;--od:1.1s"><img src="assets/img/crowd/o6.webp" alt=""><i class="gl" style="-webkit-mask-image:url(assets/img/crowd/o6.webp);mask-image:url(assets/img/crowd/o6.webp)"></i></span>
        <span class="abs orn still" style="--x:67;--y:49;--w:11;--h:12;--od:1.35s"><img src="assets/img/crowd/o7.webp" alt=""><i class="gl" style="-webkit-mask-image:url(assets/img/crowd/o7.webp);mask-image:url(assets/img/crowd/o7.webp)"></i></span>
      </div>
      <div class="abs pp" style="--x:165;--y:234;--w:73;--h:160;--d:4.2s;--dl:.1s;--di:0s"><img src="assets/img/crowd/c3.webp" alt=""></div>
      <div class="abs pp rev" style="--x:251;--y:228;--w:83;--h:166;--d:3.5s;--dl:.35s;--di:.22s">
        <img src="assets/img/crowd/c4.webp" alt="">
        <span class="abs arm" style="--x:49;--y:18;--w:25;--h:52"><img src="assets/img/crowd/arm4.webp" alt=""></span>
      </div>
      <div class="abs pp" style="--x:332;--y:241;--w:70;--h:153;--d:3.9s;--dl:.15s;--di:.44s"><img src="assets/img/crowd/c5.webp" alt=""></div>
    </div>
    <div class="layer">
      <button class="icon-btn" id="back" type="button" style="--x:16;--y:62" aria-label="Back">
        <img class="i-back" src="assets/img/back-icon.svg" alt="">
      </button>
      <div class="title" id="title" style="--x:64.8;--y:106.5"></div>
    </div>

    <div class="flow-top" style="--zh:352.3"></div>

    <form class="paper vip" id="vip-form" novalidate>
      <span class="tape rot" style="--cx:49.9;--cy:.5;--w:48.1;--h:17;--r:-12.09"></span>
      <span class="tape rot" style="--cx:316.4;--cy:1.5;--w:48.1;--h:17;--r:9.18"></span>
      <span class="stamp rot" style="--cx:71.5;--cy:45;--w:99.25;--h:54.15;--r:-9.18" aria-hidden="true">
        <img src="assets/img/stamp-frame.svg" alt=""><span style="font-size:calc(40.114 * var(--u))">VIP</span>
      </span>
      <p class="kicker-2" style="left:calc(136.96 * var(--u)); top:calc(24.8 * var(--u))">PRIVATE<br>INVITATION</p>
      <img class="perf" src="assets/img/perforation.svg" alt="" style="top:calc(76.5 * var(--u))">

      <div class="head">
        <h1 class="t-title2">Great choice!</h1>
        <p class="t-head18" style="margin-top:calc(5.6 * var(--u))">You're joining our special VIP group.</p>
        <p class="t-sub" style="margin-top:calc(22.4 * var(--u))">Confirm your email address to receive<br>instructions on the next steps<br>to fulfill your destiny.</p>
      </div>
      <div class="gap"></div>
      <label class="t-label" for="email">Email address</label>
      <div class="field-wrap">
        <input class="field" id="email" name="email" type="email" inputmode="email" autocomplete="email"
               autocapitalize="off" spellcheck="false" required aria-describedby="email-error"
               placeholder="Enter your e-mail address">
        <p class="field-error" id="email-error" role="alert"></p>
      </div>
      <button class="btn btn-primary" id="confirm" type="submit" style="margin-top:calc(24 * var(--u))">Confirm Your E-Mail Address</button>
    </form>

    <div class="flow-end"></div>
  </section>
</main>
<div class="bloom entry" id="bloom"></div>

<script src="assets/sound.js?v=7"></script>
<script src="assets/common.js?v=7"></script>
<script src="assets/slogans.js?v=7"></script>
<script>
(function () {
  var C = window.Common;
  new window.Slogan(document.getElementById('title'), 'C');   // Figma variant C
  var busy = false;
  var field = document.getElementById('email');
  var error = document.getElementById('email-error');
  var tried = false;   // errors appear only after the first Confirm, then update as you type
  var EMAIL = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[^\s@.]{2,}$/;

  function check() {
    var v = field.value.trim();
    var msg = !v ? 'Enter your e-mail address.' : (EMAIL.test(v) ? '' : 'Enter a valid e-mail address.');
    error.textContent = msg;
    if (msg) field.setAttribute('aria-invalid', 'true'); else field.removeAttribute('aria-invalid');
    return !msg;
  }
  field.addEventListener('input', function () { if (tried) check(); });

  // 1 s after the page has loaded the crowd pops up, then starts its loop
  var crowd = document.getElementById('crowd');
  if (C.reduceMotion) crowd.classList.remove('pre');
  C.afterShown(document.querySelector('.screen'), function () {
    if (C.reduceMotion) return;
    crowd.classList.remove('pre');
    crowd.classList.add('in');
    // last person: .44 s + .9 s; last coin: .14 + .38 + .33 + .42 s
    setTimeout(function () { crowd.classList.remove('in'); crowd.classList.add('live'); }, 1400);
  });

  // After a valid address: the button presses (smoke puff) for 1 s, then the
  // live behaviour: whoosh + bloom, thankyou.html at 430 ms.
  document.getElementById('vip-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    tried = true;
    if (!check()) {
      field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
      field.focus();
      return;
    }
    busy = true;
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    if (window.Sound) window.Sound.primeConfirm();
    C.pressThen(document.getElementById('confirm'), function () {
      C.leaveTo('thankyou.html', { confirmSound: true });
    });
  });

  document.getElementById('back').addEventListener('click', function () {
    if (busy) return;
    window.location.replace('./#box');
  });

  document.addEventListener('sy:restored', function () { busy = false; });
  setTimeout(function () { var b = document.getElementById('bloom'); if (b) { b.classList.remove('entry'); b.style.display = 'none'; } }, 800);
})();
</script>
</body>
</html>
