<svg xmlns="http://www.w3.org/2000/svg" width="370" height="236" viewBox="0 0 370 236" fill="none">
  <!-- Berlin Weihnachtsrally: winter night, Fernsehturm, Christmas market -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1238"/>
      <stop offset=".55" stop-color="#1A2A70"/>
      <stop offset="1" stop-color="#3A1E5C"/>
    </linearGradient>
    <radialGradient id="ballGlow" cx="262" cy="84" r="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D8BFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4D8BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="190" cy="200" r="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball" x1="250" y1="72" x2="274" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7D7FF"/>
      <stop offset="1" stop-color="#5B6FB8"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="40" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B88A"/>
      <stop offset="1" stop-color="#0A5B48"/>
    </linearGradient>
  </defs>

  <rect width="370" height="236" fill="url(#sky)"/>
  <rect width="370" height="236" fill="url(#warm)"/>
  <circle cx="262" cy="84" r="60" fill="url(#ballGlow)"/>

  <!-- distant skyline -->
  <path d="M0 168 V140 h22 v-14 h18 v20 h16 v-30 h20 v24 h14 v-18 h24 v28 h18 v-12 h26 v22 h20 v-34 h16 v30 h30 v-16 h22 v20 h18 v-26 h24 v18 h22 v-12 h20 v28 h20 V168 Z" fill="#16215C"/>
  <g fill="#F59E0B" opacity=".55">
    <rect x="26" y="132" width="3" height="3"/><rect x="62" y="122" width="3" height="3"/><rect x="62" y="130" width="3" height="3"/>
    <rect x="104" y="128" width="3" height="3"/><rect x="152" y="140" width="3" height="3"/><rect x="192" y="118" width="3" height="3"/>
    <rect x="192" y="126" width="3" height="3"/><rect x="316" y="136" width="3" height="3"/><rect x="346" y="146" width="3" height="3"/>
  </g>

  <!-- Fernsehturm -->
  <rect x="261" y="20" width="2" height="54" fill="#C7D7FF"/>
  <circle cx="262" cy="19" r="2.5" fill="#EF4444"/>
  <path d="M258 94 L256 178 H268 L266 94 Z" fill="#8FA3E0"/>
  <rect x="257" y="66" width="10" height="8" rx="2" fill="#8FA3E0"/>
  <circle cx="262" cy="84" r="14" fill="url(#ball)"/>
  <rect x="248" y="82" width="28" height="3" rx="1.5" fill="#22D3EE" opacity=".9"/>
  <circle cx="257" cy="79" r="3" fill="#fff" opacity=".6"/>

  <!-- string lights -->
  <path d="M0 108 Q92 136 185 112 T370 104" stroke="#F4F4F5" stroke-opacity=".35" stroke-width="1"/>
  <g>
    <circle cx="14" cy="112" r="2.4" fill="#F59E0B"/><circle cx="38" cy="119" r="2.4" fill="#EC4899"/>
    <circle cx="62" cy="124" r="2.4" fill="#22D3EE"/><circle cx="88" cy="126" r="2.4" fill="#F59E0B"/>
    <circle cx="114" cy="125" r="2.4" fill="#EC4899"/><circle cx="140" cy="121" r="2.4" fill="#22D3EE"/>
    <circle cx="166" cy="116" r="2.4" fill="#F59E0B"/><circle cx="214" cy="106" r="2.4" fill="#EC4899"/>
    <circle cx="300" cy="96" r="2.4" fill="#22D3EE"/><circle cx="326" cy="98" r="2.4" fill="#F59E0B"/>
    <circle cx="352" cy="102" r="2.4" fill="#EC4899"/>
  </g>

  <!-- Christmas tree -->
  <path d="M68 46 L40 96 H54 L30 140 H46 L22 186 H114 L90 140 H106 L82 96 H96 Z" fill="url(#tree)"/>
  <rect x="62" y="186" width="12" height="14" fill="#5B3A22"/>
  <path d="M68 34 l3.5 7.5 8 .9 -6 5.4 1.7 8 -7.2 -4.1 -7.2 4.1 1.7 -8 -6 -5.4 8 -.9 Z" fill="#F59E0B"/>
  <g>
    <circle cx="62" cy="80" r="2.6" fill="#F59E0B"/><circle cx="76" cy="92" r="2.6" fill="#EC4899"/>
    <circle cx="54" cy="116" r="2.6" fill="#22D3EE"/><circle cx="80" cy="124" r="2.6" fill="#F59E0B"/>
    <circle cx="44" cy="160" r="2.6" fill="#EC4899"/><circle cx="68" cy="150" r="2.6" fill="#22D3EE"/>
    <circle cx="94" cy="166" r="2.6" fill="#F59E0B"/><circle cx="62" cy="174" r="2.6" fill="#EC4899"/>
  </g>

  <!-- market stalls -->
  <g>
    <path d="M128 150 L152 132 L176 150 Z" fill="#E11D48"/>
    <path d="M140 141 L152 132 L164 141 Z" fill="#fff" opacity=".85"/>
    <rect x="130" y="150" width="44" height="40" fill="#2A1C48"/>
    <rect x="135" y="156" width="34" height="14" rx="2" fill="#F59E0B" opacity=".9"/>

    <path d="M184 154 L212 134 L240 154 Z" fill="#fff" opacity=".9"/>
    <path d="M198 144 L212 134 L226 144 Z" fill="#E11D48"/>
    <rect x="186" y="154" width="52" height="38" fill="#2A1C48"/>
    <rect x="191" y="160" width="42" height="14" rx="2" fill="#FBBF24" opacity=".9"/>

    <path d="M292 152 L318 134 L344 152 Z" fill="#E11D48"/>
    <path d="M305 143 L318 134 L331 143 Z" fill="#fff" opacity=".85"/>
    <rect x="294" y="152" width="48" height="40" fill="#2A1C48"/>
    <rect x="299" y="158" width="38" height="14" rx="2" fill="#F59E0B" opacity=".9"/>
  </g>

  <!-- snowy ground -->
  <path d="M0 196 Q90 186 185 194 T370 190 V236 H0 Z" fill="#DDE6FF" opacity=".16"/>

  <!-- snow -->
  <g fill="#fff">
    <circle cx="20" cy="22" r="1.4" opacity=".8"/><circle cx="48" cy="12" r="1" opacity=".6"/>
    <circle cx="96" cy="30" r="1.6" opacity=".8"/><circle cx="122" cy="14" r="1.1" opacity=".6"/>
    <circle cx="150" cy="44" r="1.4" opacity=".7"/><circle cx="176" cy="20" r="1" opacity=".6"/>
    <circle cx="204" cy="56" r="1.6" opacity=".8"/><circle cx="226" cy="30" r="1.2" opacity=".7"/>
    <circle cx="300" cy="50" r="1.4" opacity=".8"/><circle cx="318" cy="70" r="1" opacity=".6"/>
    <circle cx="346" cy="40" r="1.6" opacity=".8"/><circle cx="232" cy="80" r="1.1" opacity=".6"/>
    <circle cx="128" cy="70" r="1.3" opacity=".7"/><circle cx="18" cy="70" r="1.1" opacity=".6"/>
    <circle cx="112" cy="96" r="1.4" opacity=".7"/><circle cx="196" cy="88" r="1" opacity=".6"/>
    <circle cx="336" cy="120" r="1.3" opacity=".7"/><circle cx="160" cy="98" r="1.1" opacity=".6"/>
    <circle cx="10" cy="150" r="1.3" opacity=".7"/><circle cx="250" cy="140" r="1.2" opacity=".6"/>
    <circle cx="280" cy="112" r="1.5" opacity=".8"/><circle cx="356" cy="76" r="1" opacity=".6"/>
  </g>
</svg>
