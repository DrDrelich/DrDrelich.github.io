<svg xmlns="http://www.w3.org/2000/svg" width="370" height="210" viewBox="0 0 370 210" fill="none">
  <!-- Sterne-Quest: starry night, constellation route, winding road to an observatory -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B26"/>
      <stop offset=".6" stop-color="#1C1756"/>
      <stop offset="1" stop-color="#3D1F70"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FBBF24" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bigGlow" cx="178" cy="58" r="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="comet" x1="40" y1="22" x2="110" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
  </defs>

  <rect width="370" height="210" fill="url(#sky)"/>
  <circle cx="178" cy="58" r="56" fill="url(#bigGlow)"/>

  <!-- small stars -->
  <g fill="#fff">
    <circle cx="16" cy="14" r="1" opacity=".7"/><circle cx="34" cy="60" r="1.2" opacity=".8"/>
    <circle cx="72" cy="12" r=".9" opacity=".6"/><circle cx="120" cy="30" r="1.1" opacity=".7"/>
    <circle cx="140" cy="88" r=".9" opacity=".6"/><circle cx="222" cy="18" r="1.2" opacity=".8"/>
    <circle cx="246" cy="70" r=".9" opacity=".6"/><circle cx="262" cy="34" r="1" opacity=".7"/>
    <circle cx="290" cy="86" r="1.1" opacity=".7"/><circle cx="352" cy="64" r="1" opacity=".7"/>
    <circle cx="336" cy="94" r=".9" opacity=".6"/><circle cx="12" cy="104" r="1" opacity=".6"/>
    <circle cx="96" cy="74" r="1" opacity=".7"/><circle cx="200" cy="100" r=".9" opacity=".6"/>
    <circle cx="58" cy="90" r=".9" opacity=".5"/><circle cx="318" cy="12" r="1" opacity=".6"/>
  </g>

  <!-- shooting star -->
  <path d="M40 22 L110 52" stroke="url(#comet)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="110" cy="52" r="1.8" fill="#fff"/>

  <!-- constellation = the quest route -->
  <path d="M44 120 L96 98 L140 112 L178 58 L238 84 L270 52" stroke="#C084FC" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="4 4"/>
  <g>
    <circle cx="44" cy="120" r="3" fill="#22D3EE"/><circle cx="44" cy="120" r="7" fill="#22D3EE" opacity=".2"/>
    <circle cx="96" cy="98" r="2.6" fill="#EC4899"/><circle cx="96" cy="98" r="6" fill="#EC4899" opacity=".2"/>
    <circle cx="140" cy="112" r="2.6" fill="#10B981"/><circle cx="140" cy="112" r="6" fill="#10B981" opacity=".2"/>
    <circle cx="238" cy="84" r="2.6" fill="#22D3EE"/><circle cx="238" cy="84" r="6" fill="#22D3EE" opacity=".2"/>
    <circle cx="270" cy="52" r="3" fill="#C084FC"/><circle cx="270" cy="52" r="7" fill="#C084FC" opacity=".2"/>
  </g>

  <!-- the big star -->
  <path d="M178 34 L184.8 50.4 L202.5 51.7 L189 63.2 L193.2 80.5 L178 71.2 L162.8 80.5 L167 63.2 L153.5 51.7 L171.2 50.4 Z" fill="#FBBF24"/>
  <path d="M178 42 L182 52 L192.6 52.8 L184.6 59.7 L187.1 70 L178 64.4 Z" fill="#fff" opacity=".35"/>

  <!-- hills -->
  <path d="M0 150 Q70 118 150 140 T300 128 T370 132 V210 H0 Z" fill="#221C5C"/>
  <path d="M0 176 Q90 146 190 166 T370 156 V210 H0 Z" fill="#171447"/>

  <!-- observatory -->
  <rect x="300" y="112" width="34" height="20" fill="#2C2670"/>
  <path d="M298 113 A19 19 0 0 1 336 113 Z" fill="#8FA3E0"/>
  <rect x="314" y="96" width="6" height="14" rx="1" fill="#C7D7FF" transform="rotate(-28 317 103)"/>
  <rect x="312" y="120" width="10" height="12" rx="1" fill="#FBBF24" opacity=".9"/>

  <!-- winding road with headlights -->
  <path d="M120 210 C140 186 200 196 230 176 S300 150 310 134" stroke="#0B0F19" stroke-width="12" stroke-linecap="round" opacity=".9"/>
  <path d="M120 210 C140 186 200 196 230 176 S300 150 310 134" stroke="#FBBF24" stroke-opacity=".8" stroke-width="1.4" stroke-dasharray="5 6"/>
  <g>
    <rect x="222" y="170" width="22" height="10" rx="4" fill="#4D8BFF" transform="rotate(-26 233 175)"/>
    <path d="M246 164 L276 146 L280 156 Z" fill="#FDE68A" opacity=".35"/>
  </g>
</svg>
