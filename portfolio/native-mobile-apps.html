<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UX/UI Native Mobile Apps — Jacek Waz</title>
  <meta name="description" content="UX/UI native mobile apps by Jacek Waz — native iOS applications and a responsive website." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Inter:wght@400;500;600;700;800&family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@400&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       UX/UI Native Mobile Apps — vertical gallery page
       Desktop · Light mode · 1440px design frame scaled to fit
       (mirrors index.html / styles.css so the header never jumps)
       ========================================================= */

    :root{
      --page-bg:      #F2EFEF;
      --card-white:   #FFFFFF;   /* main container colour */
      --card-gray:    #E8E8E8;
      --ink:          #1A1A1A;
      --ink-body:     #484848;
      --border-soft:  #D4D4D4;
      --blue:         #007AFF;
      --radius:       14px;
      --section-bg:   #EEEEEE;   /* backdrop of the attached screens */
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
      background:var(--page-bg);
      font-family:"Inter","Helvetica Neue",Arial,sans-serif;
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow-x:hidden;     /* guard against sub-pixel rounding on the scaled frame */
    }

    /* ---------- Responsive scaling (mirrors the homepage) ---------- */
    .stage{ min-height:100vh; }

    /* The wrapper reserves the SCALED size of the frame (so a scaled-down layout
       doesn't leave empty space): width via CSS, height set by fit() in JS.
       Centered on the FULL viewport width (vw includes the scrollbar) so the
       gallery's vertical scrollbar never shifts it vs the non-scrolling homepage.
       50vw - 720px*s == the homepage's (100vw - 1440px*s)/2. */
    .wrap{
      --s:1;
      width:calc(1440px * var(--s));
      margin-top:24px;                        /* homepage stage top padding */
      margin-bottom:24px;                     /* 24px gap at the end of the page */
      margin-left:calc(50vw - 720px * var(--s));
    }

    /* The 1440px design frame: 1382px interface centered inside (29px each side),
       nav band 40px down — identical geometry to the homepage canvas, then scaled
       by --s to fit the viewport. */
    .frame{
      width:1440px;
      padding:28px 29px 0;             /* header bottom stays at 123px, like the homepage */
      transform:scale(var(--s));
      transform-origin:top left;
    }

    /* ---------- Top navigation bar (desktop: Figma "Header New", same as homepage header) ----------
       No gray card on desktop; subpage-mobile.css (≤759px) restores its own card, height and padding. */
    .topnav{
      height:95px;                     /* homepage header height (no jump) */
      display:flex;
      justify-content:space-between;   /* intro left · contact right */
      align-items:flex-end;
    }
    .topnav__intro{ display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
    .topnav__intro p{ margin:0; }
    .topnav__title{ display:flex; align-items:baseline; gap:8px; }
    .topnav__name{
      font-family:"ADLaM Display", system-ui, sans-serif;
      font-weight:400; font-size:24px; line-height:31px; color:#1a1a1a;
    }
    .topnav__loc{ font-size:16px; font-weight:400; line-height:17px; color:#4a4a4a; }
    .topnav__roles{ display:flex; gap:8px; margin:0; padding:0; list-style:none; }
    .topnav__pill{
      height:28px; padding:0 12px; border-radius:14px; background:#fff;
      display:flex; align-items:center;
      font-size:13px; font-weight:400; line-height:16px; color:#1a1a1a; white-space:nowrap;
    }
    .topnav__tags{ font-size:13px; font-weight:400; line-height:16px; color:#333; white-space:nowrap; }
    .topnav__contact{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; padding-bottom:1px; }
    .topnav__link{
      display:flex; align-items:center; gap:12px;
      font-size:13px; line-height:16px; color:#1a1a1a; white-space:nowrap;
      text-decoration:underline; text-underline-offset:2px;
      transition:color .18s ease;
    }
    .topnav__link:hover,
    .topnav__link:focus-visible{ color:var(--blue); outline:none; }
    .topnav__icon{ display:block; flex:none; margin:-.75px; }  /* SVG stroke overflows its 15px Figma slot */
    /* Email / LinkedIn links — identical style + behavior to the homepage */
    .text-link{
      color:#2c2c2c;
      text-decoration:underline;
      text-underline-offset:2px;
      transition:color .18s ease;
    }
    .text-link:hover,
    .text-link:focus-visible{
      color:var(--blue);
      text-decoration:underline;
      outline:none;
    }

    /* ---------- Content panel: title band + gallery as one panel ---------- */
    .content{
      width:100%;                      /* full interface width (1382px) */
      margin-top:24px;                 /* gap below the gray nav bar */
      background:var(--card-white);    /* single panel (no seam inside) */
      border-radius:var(--radius);
      padding:0 24px 24px;             /* 24px sides + bottom; header band supplies the top */
    }

    /* ---------- Header band (title level, inside the panel) ---------- */
    .pagehead{
      height:80px;                     /* 80px header space above the first image */
      display:flex;
      align-items:center;              /* align elements left → right */
    }

    /* Back button — pill with circular arrow + label, links to the homepage */
    .back-btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      height:40px;
      padding:0 16px 0 12px;
      border:1px solid var(--border-soft);
      border-radius:10px;
      background:transparent;
      color:var(--ink-body);
      text-decoration:none;
      transition:background-color .18s ease, border-color .18s ease, color .18s ease;
    }
    .back-btn__icon{ display:inline-flex; width:20px; height:20px; flex:0 0 20px; }
    .back-btn__icon svg{ width:20px; height:20px; display:block; }
    .back-btn__icon svg path{
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .back-btn__label{ font-size:15px; font-weight:600; line-height:1; color:inherit; }
    .back-btn:hover{ color:var(--blue); background:#FAFAFA; }
    .back-btn:focus-visible{
      outline:none;
      color:var(--ink-body);
      border-color:var(--blue);
      box-shadow:0 0 0 1px var(--blue);
    }

    /* 24px gap after the back button */
    .pagehead__title{ margin-left:24px; }

    /* Page title */
    .pagehead__title{
      margin-top:0;
      margin-bottom:0;
      font-family:"ADLaM Display", system-ui, sans-serif;
      font-weight:400;
      font-size:24px;
      line-height:1.11;                /* 111% */
      letter-spacing:-0.01em;          /* -1% */
      color:#000000;
      white-space:nowrap;
    }

    /* 8px gap after the page title */
    .pagehead__desc{ margin-left:8px; }

    /* Page description — same family/style as homepage descriptions (Inter) */
    .pagehead__desc{
      margin-top:0;
      margin-bottom:0;
      font-size:14px;
      color:#484848;
      line-height:1.4;
    }

    /* ---------- Vertical image gallery (inside the panel) ---------- */
    .gallery{
      display:flex;
      flex-direction:column;
      gap:8px;                         /* 8px vertical gap between images */
    }
    .gallery__img{
      display:block;
      width:100%;                      /* scale proportionally to the gallery */
      height:auto;
      border-radius:12px;
    }

    /* Each image sits in a titled section tinted with the screens' backdrop */
    .gallery__section{
      margin:0;
      background:var(--section-bg);
      border-radius:12px;
      overflow:hidden;
    }
    /* Section titles: same type as the page title (Space Grotesk, #1F2E25), a step smaller (18px vs 22px) */
    .gallery__title{
      margin:0;
      padding:24px 24px 0;
      font-family:"Space Grotesk", system-ui, sans-serif;
      font-weight:400;
      font-size:18px;
      line-height:1.2;
      letter-spacing:0;
      color:#1F2E25;
    }
    /* Image wrapper — lets a live screen be laid over one phone in the image */
    .gallery__media{ position:relative; }

    /* =================================================================
       Live in-flight quiz screens (Figma file "Onboarding", page LUFTHANSA,
       light flight-deck): Dashboard 182:1930, Challenges1 182:172,
       Challenges2 182:76, Duel 182:274. Each covers one phone of 2.webp. Screens are authored
       at their Figma size (402×920) and scaled to fit by fitLiveScreens().
    ================================================================= */
    /* A live section has no image: its box takes the aspect ratio from the
       section's "layout" (set inline), and each slot is one phone wide. */
    .live-slot{
      position:absolute;
      aspect-ratio:402 / 920;
      min-height:0;      /* lets aspect-ratio win over the unscaled 920px child (keeps the shadow unclipped) */
    }
    .cs{
      --ink:#0b141b; --g27:#444746; --g19:#303030; --line:#d7e1e6; --amber:#ffae01;
      width:402px; height:920px;
      transform-origin:top left;
      background:#E5E5E5;
      border-radius:32px;
      overflow:hidden;
      /* Hairline + the drop shadow of the phones in the other sections, fitted
         to their pixels (3.webp: 0 7px 25px -6px at 459px wide → ×402/459). */
      box-shadow:0 0 0 1px #dadada, 0 6px 22px -5px rgba(0,0,0,.13);
      display:flex; flex-direction:column; justify-content:space-between;
      color:var(--ink);
      font-family:"Barlow", system-ui, sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .cs p{ margin:0; }
    .cs img{ display:block; }
    .cs-mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
    .cs-cond{ font-family:"Barlow Condensed", sans-serif; font-weight:600; }
    .cs-label{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px; line-height:16px; letter-spacing:.6px; color:var(--g27); white-space:nowrap; }
    /* Figma strokes are "inside" and take no layout space, so the 1px card
       border is drawn as an overlay instead of a CSS border (which would add
       2px to every auto-height card). */
    .cs-card{ position:relative; background:#fff; }
    .cs-card::after{ content:""; position:absolute; inset:0; border:1px solid var(--line); border-radius:inherit; pointer-events:none; }

    .cs-status{ height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; }
    .cs-status__time{ font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:14px; }
    .cs-head{ height:70px; display:flex; align-items:center; justify-content:space-between; padding:8px 24px; }
    .cs-head__title{ font-size:36px; line-height:38px; }
    .cs-live{ display:flex; align-items:center; gap:6px; }
    .cs-live .cs-label, .cs-head .cs-label{ letter-spacing:.4px; }

    .cs-work{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:8px 24px 16px; }
    .cs-work > *{ flex:none; }

    .cs-telemetry{ width:100%; height:72px; border-radius:8px; display:flex; align-items:center; gap:16px; }   /* light flight-deck: sits on the screen background, no card */
    .cs-route{ flex:1 0 0; min-width:0; display:flex; flex-direction:column; gap:8px; }
    .cs-route__codes{ display:flex; justify-content:space-between; align-items:flex-start; }
    .cs-route__code{ font-family:"IBM Plex Mono", monospace; font-size:18px; line-height:normal; }
    .cs-route__path{ height:16px; display:flex; align-items:center; }
    .cs-route__done{ width:131px; height:2px; background:var(--ink); flex:none; }
    .cs-route__left{ flex:1 0 0; height:2px; background:#fff; }
    .cs-eta{ width:72px; height:40px; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
    .cs-eta__time{ font-family:"IBM Plex Mono", monospace; font-size:16px; color:var(--g27); }

    .cs-tabs{ width:100%; height:44px; background:#fff; border-bottom:1px solid var(--line); border-radius:6px; padding-left:16px; display:flex; align-items:center; gap:24px; }
    .cs-tab{ height:100%; padding-top:11px; display:flex; flex-direction:column; justify-content:space-between; }
    .cs-tab__label{ font-weight:600; font-size:14px; color:var(--g19); white-space:nowrap; }
    .cs-tab__bar{ height:3px; background:var(--amber); }
    .cs-tab--idle{ width:200px; font-size:14px; color:var(--g27); }

    .cs-dest{ width:100%; height:150px; border-radius:12px; display:flex; overflow:hidden; }
    .cs-dest__img{ width:114px; height:100%; object-fit:cover; flex:none; }
    .cs-dest__body{ flex:1 0 0; min-width:0; padding:14px; display:flex; flex-direction:column; gap:7px; }
    .cs-dest__title{ font-size:30px; line-height:28px; }
    .cs-dest__meta{ font-size:13px; line-height:18px; color:var(--g27); }

    .cs-search{ width:100%; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:9px; }
    .cs-search__head{ display:flex; justify-content:space-between; align-items:flex-start; }
    .cs-signal{ display:flex; align-items:center; gap:7px; }
    .cs-instruments{ display:flex; align-items:center; gap:10px; }
    .cs-search__title{ font-size:24px; line-height:30px; }
    .cs-search__desc{ font-size:13px; line-height:18px; color:#6f8792; }

    /* Radar — positions are the Figma coordinates inside a 210×186 box */
    .cs-radar{ position:relative; width:210px; height:186px; flex:none; overflow:hidden; }
    .cs-radar > *{ position:absolute; }
    .cs-radar__axis-h{ left:9px; top:93px; width:192px; height:1px; background:var(--line); }
    .cs-radar__axis-v{ left:105px; top:5px; width:1px; height:176px; background:var(--line); }
    .cs-radar__sector{ left:17px; top:5px; width:176px; height:176px; }
    .cs-radar__sector img{ position:absolute; left:50%; top:0; right:5.85%; bottom:50%; width:auto; height:auto; }
    .cs-radar__ray{ left:105px; top:18px; width:45px; height:75px; }
    .cs-radar__ray img{ position:absolute; top:-.69%; bottom:-.69%; left:-1.91%; right:-1.91%; width:auto; height:auto; }
    .cs-radar__dot{ width:5px; height:5px; }
    .cs-radar__halo{ left:87px; top:75px; width:36px; height:36px; }
    .cs-radar__plane{ left:95px; top:83px; width:20px; height:20px; }

    .cs-stats{ flex:1 0 0; min-width:0; height:155px; display:flex; flex-direction:column; gap:16px; }
    .cs-stats__count{ display:flex; flex-direction:column; gap:2px; }
    .cs-stats__num{ font-size:36px; line-height:normal; }
    .cs-stats__divider{ height:1px; background:var(--line); }
    .cs-stats__mode{ display:flex; flex-direction:column; gap:5px; }
    .cs-stats__mode-val{ font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--g27); }

    .cs-spacer{ width:15px; height:5px; }
    .cs-cancel{ display:grid; }
    .cs-cancel > *{ grid-area:1 / 1; }
    .cs-cancel__x{ width:15px; height:15px; margin-top:.5px; }
    .cs .cs-cancel__label{ margin-left:24px; width:94px; height:24px; font-family:"IBM Plex Mono", monospace; font-size:11px; line-height:16px; }

    .cs-nav{ background:#fff; border-top:1px solid var(--line); padding:8px 16px 9px; display:flex; flex-direction:column; align-items:center; gap:12px; }
    .cs-nav__items{ width:100%; display:flex; gap:4px; }
    .cs-nav__item{ position:relative; flex:1 0 0; min-width:0; height:54px; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font-size:11px; color:var(--g27); white-space:nowrap; }
    .cs-nav__item img{ width:20px; height:20px; }
    .cs-nav__item--active{ background:rgba(255,174,1,.2); font-weight:600; font-size:10px; color:#20372b; }
    .cs-nav__badge{ position:absolute; left:48px; top:0; width:15px; height:15px; border-radius:8px; background:var(--amber); display:flex; align-items:center; justify-content:center; font-family:"Outfit", sans-serif; font-weight:600; font-size:9px; color:var(--ink); }
    .cs-nav__home{ width:126px; height:4px; border-radius:2px; background:var(--ink); }

    /* ---- Motion — one 10s looping timeline, keyframes taken from Figma ---- */
    .cs-radar__sector{ transform-origin:50% 50%; animation:cs-spin 10s linear infinite; }
    .cs-radar__ray{ transform-origin:0 100%; animation:cs-spin 10s linear infinite; }
    .cs-radar__halo{ transform-origin:50% 50%; animation:cs-halo 10s linear infinite; }
    .cs-radar__dot--a{ left:53px;  top:46px;  animation:cs-blip-a 10s linear infinite; }
    .cs-radar__dot--b{ left:147px; top:119px; animation:cs-blip-b 10s linear infinite; }
    .cs-radar__dot--c{ left:168px; top:57px;  animation:cs-blip-c 10s linear infinite; }

    @keyframes cs-spin{ from{ transform:rotate(0deg); } to{ transform:rotate(720deg); } }
    @keyframes cs-halo{
      0%   { transform:scale(1);    animation-timing-function:ease-out; }
      7.5% { transform:scale(1.12); animation-timing-function:ease-in-out; }
      20%  { transform:scale(1); }
      25%  { transform:scale(1);    animation-timing-function:ease-out; }
      32.5%{ transform:scale(1.12); animation-timing-function:ease-in-out; }
      45%  { transform:scale(1); }
      50%  { transform:scale(1);    animation-timing-function:ease-out; }
      57.5%{ transform:scale(1.12); animation-timing-function:ease-in-out; }
      70%  { transform:scale(1); }
      75%  { transform:scale(1);    animation-timing-function:ease-out; }
      82.5%{ transform:scale(1.12); animation-timing-function:ease-in-out; }
      95%  { transform:scale(1); }
      100% { transform:scale(1); }
    }
    @keyframes cs-blip-a{
      0%{opacity:.35} 37.25%{opacity:.35;animation-timing-function:ease-out} 38.75%{opacity:1;animation-timing-function:ease-out}
      47.5%{opacity:.6;animation-timing-function:ease-out} 52.5%{opacity:.35} 87.25%{opacity:.35;animation-timing-function:ease-out}
      88.75%{opacity:1;animation-timing-function:ease-out} 97.5%{opacity:.6} 100%{opacity:.35}
    }
    @keyframes cs-blip-b{
      0%{opacity:.35} 11%{opacity:.35;animation-timing-function:ease-out} 12.5%{opacity:1;animation-timing-function:ease-out}
      21.25%{opacity:.6;animation-timing-function:ease-out} 26.25%{opacity:.35} 61%{opacity:.35;animation-timing-function:ease-out}
      62.5%{opacity:1;animation-timing-function:ease-out} 71.25%{opacity:.6;animation-timing-function:ease-out} 76.25%{opacity:.35} 100%{opacity:.35}
    }
    @keyframes cs-blip-c{
      0%{opacity:.35} 2.875%{opacity:.35;animation-timing-function:ease-out} 4.375%{opacity:1;animation-timing-function:ease-out}
      13.125%{opacity:.6;animation-timing-function:ease-out} 18.125%{opacity:.35} 52.875%{opacity:.35;animation-timing-function:ease-out}
      54.375%{opacity:1;animation-timing-function:ease-out} 63.125%{opacity:.6;animation-timing-function:ease-out} 68.125%{opacity:.35} 100%{opacity:.35}
    }
    /* ---------- Shared: action buttons ---------- */
    .cs-btn{ height:48px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:8px; font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:12px; white-space:nowrap; }
    .cs-btn img{ width:17px; height:17px; }
    .cs-btn--amber{ background:var(--amber); border:1px solid var(--amber); }
    .cs-center{ text-align:center; }
    .cs-label.cs-center{ white-space:normal; letter-spacing:.4px; }

    /* ---------- Dashboard (182:1930) ---------- */
    .cs-dash{ height:695px; display:flex; flex-direction:column; gap:12px; padding:8px 24px 28px; }   /* Figma 182:1946 "Dashboard workspace" */
    .cs-dash > *{ flex:none; width:100%; }
    .cs-checkin{ border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .cs-checkin__title{ font-size:24px; line-height:29px; color:rgba(11,20,27,.9); text-align:center; }
    .cs-last{ border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:16px; }
    .cs-last__cat{ font-size:36px; line-height:38px; text-align:center; }
    .cs-last__actions{ display:flex; gap:10px; }
    .cs-last__actions .cs-btn{ flex:1 0 0; min-width:0; }
    .cs-results{ height:251px; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; }
    .cs-results__head{ background:rgba(255,174,1,.2); padding:12px 16px; display:flex; align-items:center; gap:8px; }
    .cs-results__head img{ width:18px; height:18px; }
    .cs-results__title{ font-size:24px; line-height:27px; color:#20372b; }
    .cs-results__body{ height:200px; flex:none; padding:16px; display:flex; flex-direction:column; align-items:center; gap:12px; }
    .cs-results__body > *{ width:100%; flex:none; }
    .cs-results__id{ height:64px; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .cs-results__id .cs-chip{ width:auto; }
    .cs-results__won{ font-size:24px; line-height:normal; text-align:center; }
    .cs-results__gap{ height:5px; }

    /* Entrance (Figma "once", 2.38s): each card rises 16px and fades in,
       staggered 1.00s / 1.24s / 1.48s. Starts when the screen scrolls into view. */
    .cs-rise{ opacity:0; transform:translateY(16px); }
    .is-visible .cs-rise{
      animation:cs-rise .9s cubic-bezier(.22,1,.36,1) both, cs-fade .6s cubic-bezier(.22,1,.36,1) both;
    }
    .is-visible .cs-rise--1{ animation-delay:1s, 1s; }
    .is-visible .cs-rise--2{ animation-delay:1.24s, 1.24s; }
    .is-visible .cs-rise--3{ animation-delay:1.48s, 1.48s; }
    @keyframes cs-rise{ from{ transform:translateY(16px); } to{ transform:translateY(0); } }
    @keyframes cs-fade{ from{ opacity:0; } to{ opacity:1; } }

    /* ---------- Challenges — opponent found (182:76) ---------- */
    .cs-head-block{ height:117px; flex:none; }
    .cs-found-area{ height:714px; flex:none; }
    .cs-found{ height:707px; display:flex; flex-direction:column; gap:12px; padding:8px 24px 20px; }

    /* =================================================================
       Live Deu Quest screens (Figma "Portfolio", page "Deu Quest Mobile"):
       Aktivitäten 190:436, Quests 190:553, Rally map 191:4079, Profil 190:951.
       Each covers one phone of 3.webp. Screens are 402×874 and every element
       sits at its Figma position (see the templates). The numbers in the
       comments below are the micro-interaction IDs of the motion spec.
    ================================================================= */
    .live-slot--dq{ aspect-ratio:402 / 874; }
    .dq{
      position:relative; width:402px; height:874px;
      transform-origin:top left;
      border-radius:44px; overflow:hidden;
      background:#0B0F19;
      box-shadow:0 6px 22px -5px rgba(0,0,0,.13);
      color:#fff;
      font-family:"Inter", system-ui, sans-serif;
      -webkit-font-smoothing:antialiased;
      /* motion tokens */
      --ease-out:cubic-bezier(.22,1,.36,1);       /* entrances (iOS "smooth") */
      --ease-spring:cubic-bezier(.34,1.56,.64,1); /* small overshoot (iOS "bouncy") */
      --ease-io:cubic-bezier(.65,0,.35,1);        /* drawing strokes */
    }
    .dq img{ display:block; max-width:none; }
    .dq-a, .dq-t, .dq-clip, .dq-shine, .dq-layer, .dq-pulse, .dq-medals, .dq-route-svg{ position:absolute; }
    .dq-t{ margin:0; line-height:normal; white-space:nowrap; }
    .dq-c{ transform:translateX(-50%); }
    .dq-clip, .dq-shine{ overflow:hidden; box-sizing:border-box; }
    .dq-clip > img{ position:absolute; }
    .dq-layer{ inset:0; pointer-events:none; }
    .dq-streets{ transform:rotate(-12deg); }
    /* "Ich" tile border and bar: white, to match the white ring of the "Ich" marker on the map */
    .dq-white{ filter:brightness(0) invert(1); }
    .dq-medals{ display:flex; gap:26px; align-items:center; justify-content:center; }
    .dq-medal{ display:inline-grid; place-items:start; }
    .dq-medal > *{ grid-area:1 / 1; }
    .dq-medal p{ margin-bottom:0; font-size:12px; line-height:normal; color:#f4f4f5; white-space:nowrap; }

    @keyframes dq-rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
    @keyframes dq-fadein{ to{ opacity:1; } }

    /* 4 · 8 — staggered entrance of cards / tiles (--i = order) */
    .dq-in{ opacity:0; transform:translateY(12px); }
    .is-visible .dq-in{ animation:dq-rise .55s var(--ease-out) both; animation-delay:calc(.15s + var(--i) * .07s); }

    /* 2 · 8 — photos move with a scroll parallax (JS sets --py) */
    .dq-parallax{ transform:translateY(var(--py, 0px)) scale(1.1); will-change:transform; }
    /* 2 — one light sweep across the speedometer */
    .dq-hero::after{
      content:""; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%);
      transform:translateX(-100%);
    }
    .is-visible .dq-hero::after{ animation:dq-sweep 1.2s cubic-bezier(.45,0,.2,1) .35s both; }
    @keyframes dq-sweep{ from{ transform:translateX(-100%); } to{ transform:translateX(100%); } }

    /* 1 — "Pkt" pops once the counter lands (JS adds .is-done) */
    .dq-pop{ transform-origin:0 100%; }
    .dq-pop.is-done{ animation:dq-pop .32s ease-out; }
    @keyframes dq-pop{ 50%{ transform:scale(1.08); } }

    /* 3 — progress bars fill in turn; the points value appears as each bar lands */
    .dq-fill{ clip-path:inset(0 100% 0 0); }
    .is-visible .dq-fill{ animation:dq-fill .7s cubic-bezier(.33,1,.68,1) both; animation-delay:calc(.45s + var(--i) * .06s); }
    @keyframes dq-fill{ from{ clip-path:inset(0 100% 0 0); } to{ clip-path:inset(0 0 0 0); } }
    .dq-num{ opacity:0; transform:scale(.8); transform-origin:100% 50%; }
    .is-visible .dq-num{ animation:dq-num .35s var(--ease-spring) both; animation-delay:calc(1.05s + var(--i) * .06s); }
    @keyframes dq-num{ from{ opacity:0; transform:scale(.8); } to{ opacity:1; transform:none; } }

    /* 5 — category icons: one short gesture on first view, replayed on hover / tap */
    .dq-tile > :first-child{ pointer-events:auto; cursor:pointer; }
    .dq-icon{ transform-origin:50% 50%; }
    .is-visible .dq-icon{ animation-duration:.9s; animation-timing-function:ease-in-out; animation-fill-mode:both; animation-delay:calc(.75s + var(--i) * .07s); }
    .is-visible .dq-icon--road,
    .is-visible .dq-icon--fuel{ animation-name:dq-icon-pulse; }
    .is-visible .dq-icon--leaf{ animation-name:dq-icon-sway; }
    .is-visible .dq-icon--coffee{ animation-name:dq-icon-bob; }
    .is-visible .dq-icon--jam{ animation-name:dq-icon-shake; animation-duration:.6s; }
    @keyframes dq-icon-pulse{ 30%{ transform:scale(1.2); } 55%{ transform:scale(.95); } 75%{ transform:scale(1.08); } }
    @keyframes dq-icon-sway{ 20%{ transform:rotate(-14deg); } 45%{ transform:rotate(10deg); } 70%{ transform:rotate(-5deg); } }
    @keyframes dq-icon-bob{ 25%{ transform:translateY(-3px); } 50%{ transform:none; } 75%{ transform:translateY(-1.5px); } }
    @keyframes dq-icon-shake{ 20%{ transform:translateX(-2px); } 40%{ transform:translateX(2px); } 60%{ transform:translateX(-1.5px); } 80%{ transform:translateX(1.5px); } }

    /* 9 · 16 — "live" pulse: a ring grows out of the status dot, forever */
    .dq-pulse{ border-radius:50%; background:#fff; opacity:0; }
    .dq-pulse--green{ background:#10b981; }
    .is-visible .dq-pulse{ animation:dq-pulse 1.6s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes dq-pulse{ 0%{ transform:scale(1); opacity:.7; } 100%{ transform:scale(2.4); opacity:0; } }

    /* 10 — participant avatars pop in one after another (--a = place in the stack) */
    .dq-av{ opacity:0; transform:scale(.6); }
    .is-visible .dq-av{ animation:dq-av .4s var(--ease-spring) both; animation-delay:calc(.4s + var(--i) * .07s + var(--a) * .04s); }
    @keyframes dq-av{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:none; } }
    .dq-more.is-done{ animation:dq-tick .4s var(--ease-spring); }
    @keyframes dq-tick{ 40%{ transform:translateX(-50%) scale(1.4); } }

    /* 11 — one shine across the points pill when its card has arrived */
    /* Points pills: the Figma SVG draws its 1px white edge as a masked inner
       stroke, which renders soft and uneven once the screen is scaled down.
       A CSS border on top keeps the edge crisp at every size. */
    .dq-pill-edge{ position:absolute; inset:0; border:1px solid #fff; border-radius:inherit; box-sizing:border-box; pointer-events:none; }
    .dq-shine::after{
      content:""; position:absolute; inset:0;
      background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
      transform:translateX(-110%);
    }
    .is-visible .dq-shine::after{ animation:dq-shine .9s ease-in-out both; animation-delay:calc(.8s + var(--i) * .07s); }
    @keyframes dq-shine{ from{ transform:translateX(-110%); } to{ transform:translateX(110%); } }

    /* 13 — routes draw from Start to the finish, one by one, then a light runs
       along each route in the direction of travel. JS inlines the route SVGs and
       sets --len (path length) and --r (route index). */
    .dq-route-draw{ stroke-dasharray:var(--len); stroke-dashoffset:var(--len); }
    .is-visible .dq-route-draw{ animation:dq-draw 1s var(--ease-io) forwards; animation-delay:calc(.3s + var(--r) * .8s); }
    @keyframes dq-draw{ to{ stroke-dashoffset:0; } }
    .dq-route-flow{ stroke-dasharray:22px var(--len); stroke-dashoffset:22px; opacity:0; }
    .is-visible .dq-route-flow{
      animation:dq-flow 3.2s linear infinite, dq-fadein .4s ease forwards;
      animation-delay:calc(1.3s + var(--r) * .8s);
    }
    @keyframes dq-flow{ from{ stroke-dashoffset:22px; } to{ stroke-dashoffset:calc(var(--len) * -1); } }

    /* 15 — the finish flag waves (JS groups the flag paths of the inlined marker) */
    .dq-flag{ transform-box:view-box; transform-origin:35.5px 1px; }
    .is-visible .dq-flag{ animation:dq-wave 2s ease-in-out infinite alternate; }
    @keyframes dq-wave{ from{ transform:rotate(-4deg); } to{ transform:rotate(4deg); } }

    /* 19 — the profile ring draws round the photo, then the online dot pops */
    @property --dq-sweep{ syntax:"<angle>"; inherits:false; initial-value:0deg; }
    .dq-ring{
      -webkit-mask:conic-gradient(#000 var(--dq-sweep), transparent 0);
              mask:conic-gradient(#000 var(--dq-sweep), transparent 0);
    }
    .is-visible .dq-ring{ animation:dq-ring .7s var(--ease-io) .25s both; }
    @keyframes dq-ring{ from{ --dq-sweep:0deg; } to{ --dq-sweep:360deg; } }
    .dq-online{ transform:scale(0); }
    .is-visible .dq-online{ animation:dq-online .45s var(--ease-spring) .95s both; }
    @keyframes dq-online{ from{ transform:scale(0); } to{ transform:none; } }

    /* 20 — the red "on the road" dot breathes */
    .is-visible .dq-blink{ animation:dq-blink 1.2s ease-in-out infinite alternate; }
    @keyframes dq-blink{ to{ opacity:.35; } }

    /* 21 — the rank lifts once its counter lands (JS adds .is-done) */
    .dq-rank.is-done{ animation:dq-lift .5s var(--ease-spring); }
    @keyframes dq-lift{ 45%{ transform:translateX(-50%) translateY(-5px); } }

    /* 23 — recent actions slide in; their points flash the category colour */
    .dq-row{ opacity:0; transform:translateY(10px); }
    .is-visible .dq-row{ animation:dq-rise .5s var(--ease-out) both; animation-delay:calc(.5s + var(--r) * .08s); }
    .is-visible .dq-flash{ animation:dq-flash .9s ease both; animation-delay:calc(.95s + var(--r) * .08s); }
    @keyframes dq-flash{ 30%, 60%{ color:var(--accent); } }

    @media (prefers-reduced-motion: reduce){
      .dq *, .dq *::after{ animation:none !important; }
      .dq-in, .dq-row, .dq-av, .dq-num, .dq-online{ opacity:1; transform:none; }
      .dq-fill{ clip-path:none; }
      .dq-parallax{ transform:none; }
      .dq-hero::after, .dq-shine::after, .dq-pulse, .dq-route-flow{ display:none; }
      .dq-ring{ -webkit-mask:none; mask:none; }
      .dq-route-draw{ stroke-dasharray:none; stroke-dashoffset:0; }
    }

    /* =================================================================
       Mobile (≤759px): 4-phone sections as a 2 × 2 grid.
       Image sections: the same 4-phone image is shown in 4 tiles, each
       cropped to one phone (one download). Crop per tile = phone width
       22.95% + 0.8% margin each side = 24.55% of the image, so the image
       is 100 / 24.55 = 407.33% of the tile, shifted by --x (crop start).
       Live section: the 4 live screens drop into the same grid, with the
       same margins the phones have inside the image tiles.
       Desktop keeps the single wide image (tiles stay hidden).
    ================================================================= */
    .gallery__tiles{ display:none; }
    @media (max-width:759px){
      .gallery__media--phones > .gallery__img{ display:none; }
      .gallery__tiles,
      .gallery__media--live{
        display:grid;
        grid-template-columns:repeat(2, minmax(0, 1fr));
        padding:4px 6px 6px;
      }
      .gallery__tile{ overflow:hidden; min-width:0; }
      .gallery__tile img{
        display:block;
        width:407.33%;
        max-width:none;
        height:auto;
        margin-left:calc(var(--x) * -407.33%);
        border-radius:0;
      }
      .gallery__media--live{ aspect-ratio:auto !important; }
      .gallery__media--live .live-slot{
        position:relative;
        left:auto !important; top:auto !important; width:auto !important;
        min-width:0;
        margin:4.89% 3.26% 6.9%;    /* = the phone's margins inside an image tile */
      }
    }

    /* Mobile-only markup stays hidden on desktop; subpage-mobile.css reveals it. */
    .m-only{ display:none; }

  <script>

    var IMAGE_DIR = './NATIVE MOBILE APPS/';

    var SECTIONS = [
      {"file": "1.webp", "title": "Native iOS application", "phones": true, "alt": "Native iOS fitness coaching game: notifications, avatar configuration and two My player screens with food, training and energy levels"},
      {"file": "2.webp", "title": "Native iOS application", "alt": "Native iOS in-flight quiz game: a flight-deck dashboard with the flight route, the last played category and a winning streak, an animated radar searching for a duel opponent for the Brussels challenge, the opponent found with their rankings, and a trivia question about Brussels sprouts",
       /* Live screens instead of the image. Geometry copied from the phones in

          (22.95%), 33px gaps (1.65%), first phone at x 32 (1.6%), top 24px.

       "layout": {"aspect": "2000 / 1110.4", "top": 2.161, "width": 22.95},
       "overlays": [

       "layout": {"aspect": "2000 / 1057.9", "top": 2.269, "width": 22.95, "slot": "live-slot--dq"},

    /* -----------------------------------------------------------------
       Responsive scaling — mirrors the homepage's fit() exactly so the
       shared gray header bar sits at the identical position and size on
       both pages at every viewport size. A 1440px design frame is scaled
       by s = min(availW/1440, availH/837, 1); the wrapper is sized to the
       SCALED frame (width via CSS, height here) and the tall gallery
       scrolls vertically below.
    ----------------------------------------------------------------- */
    // Mobile breakpoint — must match the media attribute on subpage-mobile.css.
    var MOBILE = window.matchMedia('(max-width: 759px)');
    var fit = (function(){
      var DESIGN_W = 1440, DESIGN_H = 837, MARGIN = 24;
      var wrap = document.querySelector('.wrap');
      var frame = document.querySelector('.frame');
      return function fit(){
        // Mobile: no scaling — the frame flows at real size (subpage-mobile.css)
        if (MOBILE.matches) {
          wrap.style.removeProperty('--s');
          wrap.style.width = '';
          wrap.style.height = '';
          return;
        }
        var availW = window.innerWidth  - MARGIN * 2;
        var availH = window.innerHeight - MARGIN * 2 - 1;
        var s = Math.min(availW / DESIGN_W, availH / DESIGN_H, 1);
        wrap.style.setProperty('--s', s);
        wrap.style.width  = (DESIGN_W * s) + 'px';
        wrap.style.height = (frame.offsetHeight * s) + 'px';  // reserve scaled height
      };
    })();

    var liveSlots = [];

    /* Mobile 2 × 2 tiles: where each phone's crop starts, as a fraction of the

    var PHONE_CROPS = [0.008, 0.254, 0.4995, 0.746];

    (function renderGallery(){
      var gallery = document.getElementById('gallery');
      var frag = document.createDocumentFragment();

      SECTIONS.forEach(function (section, i){
        var fig = document.createElement('section');
        fig.className = 'gallery__section';

        var title = document.createElement('h2');
        title.className = 'gallery__title';
        title.textContent = section.title;

        var img = document.createElement('img');
        img.className = 'gallery__img';
        if (!section.layout) img.src = IMAGE_DIR + section.file;   // live sections skip the image

            tile.style.setProperty('--x', x);

            t.src = IMAGE_DIR + section.file;
            t.alt = '';
            t.decoding = 'async';

          media.appendChild(slot);

        fig.appendChild(media);
        frag.appendChild(fig);
      });

      gallery.appendChild(frag);
    })();

    /* Scale each live 402×920 screen to the width of its slot. The slot
       is measured untransformed (offsetWidth), so the desktop frame's own
       scale is applied once, by the frame, not twice. */
    function fitLiveScreens(){
      liveSlots.forEach(function (slot){
        var screen = slot.firstElementChild;
        if (!screen) return;
        screen.style.transform = 'scale(' + (slot.offsetWidth / 402) + ')';

    /* Deu Quest screens: the parts CSS cannot do alone — counters, the "+6"

       and finish-flag SVGs so their strokes can be drawn / the flag waved. */
    var DQ = (function (){
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var parallax = [];
      var uid = 0;

      function fmt(el, v){ el.textContent = (el.dataset.prefix || '') + v.toLocaleString('de-DE'); }

      function inlineSvg(img, done){
        fetch(img.src).then(function (r){ return r.text(); }).then(function (txt){
          var svg = new DOMParser().parseFromString(txt, 'image/svg+xml').documentElement;
          if (!svg || svg.nodeName !== 'svg') return;
          svg = document.importNode(svg, true);
          svg.removeAttribute('style');
          svg.setAttribute('class', img.className.replace('dq-a', 'dq-route-svg'));
          svg.setAttribute('style', img.getAttribute('style'));
          svg.setAttribute('aria-hidden', 'true');
          img.parentNode.replaceChild(svg, img);
          done(svg);
        }).catch(function (){ /* keep the static <img> */ });
      }

      // 13 — each route SVG has a faint wide glow (1st path) and the coloured
      // dashes (2nd path, pre-cut into segments). The two do not always follow
      // the same line (route B's glow takes another way round Robert), so the
      // draw reveal and the cut at the leading participant use a "track"
      // rebuilt from the dash segments, and the running light follows that
      // track up to the participant, then the glow on to the finish. Figma exports the start piece first, then the end piece,
      // then the rest in order; the track joins them in travel order.
      // stop = leading participant's marker centre (screen coords), ox/oy = route offset.
      function track(dashes){
        var segs = dashes.getAttribute('d').split('M').filter(Boolean);
        if (segs.length < 3) return null;
        var end = segs[1].match(/-?[\d.]+/g);                 // "x1 y1 L x2 y2", from the finish inwards
        var d = 'M' + segs[0] + segs.slice(2).map(function (s){ return 'L' + s; }).join('')
              + 'L' + end[2] + ' ' + end[3] + 'L' + end[0] + ' ' + end[1];
        var path = dashes.cloneNode();
        path.removeAttribute('id');
        path.removeAttribute('mask');
        path.setAttribute('d', d);
        return path;
      }

      function stroke(src, cls, width, color, opacity){
        var p = src.cloneNode();
        p.removeAttribute('id');
        p.setAttribute('stroke', color);
        p.setAttribute('stroke-opacity', opacity);
        p.setAttribute('stroke-width', width);
        p.setAttribute('fill', 'none');
        if (cls) p.setAttribute('class', cls);
        return p;
      }

      function route(svg, index, stop, ox, oy){
        var NS = 'http://www.w3.org/2000/svg';
        var g = svg.querySelector('g');
        var paths = g ? g.querySelectorAll('path') : [];
        var glow = paths[0], dashes = paths[1];
        if (!glow || !dashes) return;
        var path = track(dashes) || glow;
        var defs = document.createElementNS(NS, 'defs');
        svg.insertBefore(defs, svg.firstChild);
        defs.appendChild(path);                                // in the DOM, so it can be measured
        var len = Math.ceil(path.getTotalLength());
        var glowLen = Math.ceil(glow.getTotalLength());
        var id = 'dq-route-' + (++uid);

        // Draw from Start: reveal the glow along its own line and the dashes along the track.
        var mask = document.createElementNS(NS, 'mask');
        mask.setAttribute('id', id);
        mask.setAttribute('maskUnits', 'userSpaceOnUse');
        var r1 = stroke(glow, 'dq-route-draw', 18, '#fff', 1);
        r1.style.setProperty('--len', glowLen + 'px');
        var r2 = stroke(path, 'dq-route-draw', 18, '#fff', 1);
        r2.style.setProperty('--len', len + 'px');
        mask.appendChild(r1);
        mask.appendChild(r2);
        defs.appendChild(mask);
        g.setAttribute('mask', 'url(#' + id + ')');

        // Keep the coloured dashes only from Start to the leading participant.
        var lightPath = path, lightLen = len;
        if (stop){
          var p = stop.split(',').map(Number), sx = p[0] - ox, sy = p[1] - oy;
          var cut = nearest(path, len, sx, sy);
          // The light: along the dashes up to the participant, then along the
          // glow (the faint route still visible) from there to the finish.
          var at = path.getPointAtLength(cut);
          var from = nearest(glow, glowLen, at.x, at.y), pts = [];
          for (var a = 0; a < cut; a += 2) pts.push(path.getPointAtLength(a));
          for (var b = from; b <= glowLen; b += 2) pts.push(glow.getPointAtLength(b));
          pts.push(glow.getPointAtLength(glowLen));
          lightPath = document.createElementNS(NS, 'path');
          lightPath.setAttribute('d', 'M' + pts.map(function (q){ return q.x.toFixed(1) + ' ' + q.y.toFixed(1); }).join('L'));
          defs.appendChild(lightPath);
          lightLen = Math.ceil(lightPath.getTotalLength());
          var keep = document.createElementNS(NS, 'mask');
          keep.setAttribute('id', id + '-stop');
          keep.setAttribute('maskUnits', 'userSpaceOnUse');
          var part = stroke(path, '', 18, '#fff', 1);
          part.setAttribute('stroke-linecap', 'butt');
          part.setAttribute('stroke-dasharray', cut + ' ' + (len + 20));
          keep.appendChild(part);
          defs.appendChild(keep);
          dashes.setAttribute('mask', 'url(#' + id + '-stop)');
        }

        // The light runs all the way to the finish.
        var flow = stroke(lightPath, 'dq-route-flow', 3, '#fff', '.75');
        flow.setAttribute('stroke-linecap', 'round');
        flow.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(flow);
        svg.style.setProperty('--len', lightLen + 'px');
        svg.style.setProperty('--r', index);
      }

      // Length along `path` of the point closest to (x, y), to 1px.
      function nearest(path, len, x, y){
        var at = 0, best = Infinity;
        for (var l = 0; l <= len; l++){
          var q = path.getPointAtLength(l), d = (q.x - x) * (q.x - x) + (q.y - y) * (q.y - y);
          if (d < best){ best = d; at = l; }
        }
        return at;
      }

      // 15 — group the four flag paths so they can swing round the top of the pole
      function flag(svg){
        var NS = 'http://www.w3.org/2000/svg';
        var parts = ['Vector_4', 'Vector_5', 'Vector_6', 'Vector_7']
          .map(function (id){ return svg.querySelector('[id="' + id + '"]'); })
          .filter(Boolean);
        if (!parts.length) return;
        var g = document.createElementNS(NS, 'g');
        g.setAttribute('class', 'dq-flag');
        parts[0].parentNode.insertBefore(g, parts[0]);
        parts.forEach(function (p){ g.appendChild(p); });
      }

      function init(slot){
        if (!slot.querySelector('[data-dq]')) return;
        slot.querySelectorAll('.dq-count').forEach(function (el){
          if (!reduce) fmt(el, +(el.dataset.from || 0));
        });
        slot.querySelectorAll('.dq-more').forEach(function (el){
          if (!reduce){ el.dataset.to = el.textContent; el.textContent = el.dataset.from; }
        });
        slot.querySelectorAll('.dq-parallax').forEach(function (el){ parallax.push(el); });
        slot.querySelectorAll('img.dq-route').forEach(function (img){
          var i = +img.dataset.route, stop = img.dataset.stop;
          var ox = parseFloat(img.style.left), oy = parseFloat(img.style.top);
          inlineSvg(img, function (svg){ route(svg, i, stop, ox, oy); });
        });
        if (!reduce) slot.querySelectorAll('img.dq-ziel').forEach(function (img){ inlineSvg(img, flag); });

        slot.querySelectorAll('.dq-tile').forEach(function (tile){
          var icon = tile.querySelector('.dq-icon');
          var hit = tile.firstElementChild;
          if (!icon || !hit || reduce) return;
          function replay(){
            if (!slot.classList.contains('is-visible')) return;
            icon.style.animation = 'none';
            void icon.offsetWidth;
            icon.style.animation = '';
            icon.style.animationDelay = '0s';
          }
          hit.addEventListener('pointerenter', replay);
          hit.addEventListener('pointerdown', replay);
        });
      }

      // 1 · 21 — count up with an ease-out, then let the neighbour / the rank react
      function count(el){
        var from = +(el.dataset.from || 0), to = +el.dataset.to;
        var delay = el.dataset.delay != null ? +el.dataset.delay : 250, dur = 900;
        setTimeout(function (){
          var t0 = performance.now();
          (function step(now){
            var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
            fmt(el, Math.round(from + (to - from) * e));
            if (p < 1) return requestAnimationFrame(step);
            el.classList.add('is-done');
            var pop = el.parentNode.querySelector('.dq-pop');
            if (pop) pop.classList.add('is-done');
          })(t0);
        }, delay);
      }

      function play(slot){
        if (reduce || !slot.querySelector('[data-dq]')) return;
        slot.querySelectorAll('.dq-count').forEach(count);
        // 10 — one more participant joins after the avatars have arrived
        slot.querySelectorAll('.dq-more').forEach(function (el){
          setTimeout(function (){ el.textContent = el.dataset.to; el.classList.add('is-done'); }, 1700);
        });
      }

      // 2 · 8 — photos drift up to ±10px against the scroll (they are scaled 1.1, so no edge shows)
      var ticking = false;
      function updateParallax(){
        ticking = false;
        var vh = window.innerHeight || 1;
        parallax.forEach(function (el){
          var r = el.parentNode.getBoundingClientRect();
          var p = ((r.top + r.height / 2) - vh / 2) / vh;
          p = Math.max(-1, Math.min(1, p));
          el.style.setProperty('--py', (-p * 10).toFixed(2) + 'px');
        });
      }
      if (!reduce){
        window.addEventListener('scroll', function (){
          if (!ticking){ ticking = true; requestAnimationFrame(updateParallax); }
        }, { passive: true, capture: true });
        window.addEventListener('resize', updateParallax);
      }

      return { init: init, play: play, update: updateParallax };
    })();
    liveSlots.forEach(DQ.init);
    DQ.update();

    /* One-shot entrance motion (Flight Quiz dashboard, Deu Quest screens) plays
       the first time its screen is mostly in view — not on page load, when it
       may be far below. Observing starts only after every gallery image has
       loaded: before that the sections above are still short, so screens far
       down the page would briefly sit in the viewport and play unseen. */
    (function startEntrances(){
      var slots = liveSlots.filter(function (s){ return s.querySelector('.cs-rise, [data-dq]'); });
      function show(s){ s.classList.add('is-visible'); DQ.play(s); }
      if (!('IntersectionObserver' in window)){
        slots.forEach(show);
        return;
      }
      function observe(){
        var io = new IntersectionObserver(function (entries){
          entries.forEach(function (e){
            if (!e.isIntersecting) return;
            // Re-check the live geometry: the observer's snapshot can predate a layout shift.
            var r = e.target.getBoundingClientRect(), vh = window.innerHeight;
            var seen = Math.min(r.bottom, vh) - Math.max(r.top, 0);
            if (seen < r.height * 0.5) return;
            show(e.target); io.unobserve(e.target);
          });
        }, { threshold: [0.5, 0.75, 1] });
        slots.forEach(function (s){ io.observe(s); });
      }
      if (document.readyState === 'complete') observe();
      else window.addEventListener('load', observe);
    })();

    fit();
    window.addEventListener('resize', fit);
    if (MOBILE.addEventListener) MOBILE.addEventListener('change', fit);
    window.addEventListener('load', fit);
  </script>

    // Confetti only on the Back button (the handoff spec has a decorative element with class "cta").
    window.CONFETTI_SELECTOR = '.back-btn[data-confetti]';
  </script>
